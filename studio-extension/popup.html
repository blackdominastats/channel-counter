<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio count test</title>
<style>
body{width:340px;margin:0;padding:16px;background:#101827;color:#f8fafc;font:14px/1.5 Arial,sans-serif}
h2{font-size:17px;margin:0 0 8px}.muted{color:#aab7ca}.status{padding:10px;background:#1e293b;border-radius:7px;margin:12px 0}
button{width:100%;padding:10px;border:0;border-radius:6px;background:#818cf8;color:#111827;font-weight:700;cursor:pointer}
.item{padding:9px;margin:8px 0;background:#1e293b;border-radius:6px;overflow-wrap:anywhere}
.num{font-size:20px;font-weight:700;color:#86efac}.small{font-size:12px;color:#aab7ca}
</style>
</head>
<body>
<h2>YouTube Studio count test</h2>
<div class="muted">Open your own Studio Analytics → Realtime → See Live Count page, then press the button.</div>
<div id="status" class="status">Waiting to scan the active tab.</div>
<button id="scan">Read visible Studio count</button>
<div id="results"></div>
<p class="small">Test only: this extension reads visible page text locally. It does not send counts, Google account details, cookies or tokens anywhere.</p>
<script src="popup.js"></script>
</body>
</html>
